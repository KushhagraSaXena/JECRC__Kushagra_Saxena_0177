<div class="task-wrapper">

<div class="task-header">
<div>
<h2>Task Manager</h2>
<p>Organize your work efficiently</p>
</div>
</div>

<app-task-form
(taskAdded)="onTaskAdded($event)">
</app-task-form>

<div class="task-grid">

<!-- Pending Tasks -->

<div class="task-section">
<h3>Pending Tasks</h3>

<ng-container *ngFor="let task of tasks">

<div 
class="task-card"
*ngIf="!task.completed">

<div class="task-content">

<label>
<input
type="checkbox"
[checked]="task.completed"
(change)="toggleTask(task)"
/>

<span>{{task.title}}</span>

</label>

<button
class="delete-btn"
(click)="deleteTask(task.id)">
Delete
</button>

</div>

</div>

</ng-container>

</div>


<!-- Completed Tasks -->

<div class="task-section">
<h3>Completed</h3>

<ng-container *ngFor="let task of tasks">

<div 
class="task-card completed-card"
*ngIf="task.completed">

<div class="task-content">

<label>

<input
type="checkbox"
[checked]="task.completed"
(change)="toggleTask(task)"
/>

<span>{{task.title}}</span>

</label>

<button
class="delete-btn"
(click)="deleteTask(task.id)">
Delete
</button>

</div>

</div>

</ng-container>

</div>

</div>

</div>
