<div class="error-container">
  <div class="error-content">
    <div class="error-code">404</div>
    <div class="error-message">
      <h1>Page Not Found</h1>
      <p>Sorry, the page you're looking for doesn't exist or has been moved.</p>
    </div>
    <div class="error-icon">😕</div>
    <div class="error-suggestions">
      <p>Here are some helpful links instead:</p>
      <div class="suggestion-links">
        <a href="/" class="link-btn">← Back to Home</a>
        <a href="/product" class="link-btn">Browse Products</a>
        <a href="/contact" class="link-btn">Contact Us</a>
      </div>
    </div>
    <div class="search-section">
      <h3>Or search for something:</h3>
      <div class="search-box">
        <input type="text" placeholder="Search products, categories, help..." class="search-input">
        <button class="search-btn">Search</button>
      </div>
    </div>
  </div>
  <div class="error-decoration"></div>
</div>
