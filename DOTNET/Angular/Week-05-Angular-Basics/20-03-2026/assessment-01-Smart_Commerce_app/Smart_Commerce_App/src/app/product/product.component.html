<h2>Products</h2>

<div class="search-box">
  <input [(ngModel)]="searchText" placeholder="Search products">
</div>

<div class="grid">
  <div class="card" *ngFor="let p of products">
    
    <div class="img-placeholder"></div>

    <h3>{{ p.name }}</h3>

    <p class="price">{{ p.price | currency:'INR' }}</p>

    <p class="rating">Rating: {{ p.rating }}/5</p>

    <button (click)="addToCart(p)">Add to Cart</button>
  </div>
</div>
