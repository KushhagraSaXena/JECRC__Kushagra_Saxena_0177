<h2>🛒 Product Dashboard</h2>

<button (click)="showProducts = !showProducts">
  {{ showProducts ? 'Hide Products' : 'Show Products' }}
</button>

<div *ngIf="showProducts">

  <h3>Available Products</h3>

  <div *ngFor="let p of products" class="card">

    <h3>{{ p.name }}</h3>

    <p [ngClass]="{
      'high-price': p.price > 30000,
      'low-price': p.price <= 30000
    }">
      Price: {{ p.price }}
    </p>

    <div [ngSwitch]="p.status">

      <p *ngSwitchCase="'available'">✅ In Stock</p>
      <p *ngSwitchCase="'out'">❌ Out Of Stock</p>
      <p *ngSwitchCase="'limited'">⚠️ Limited Stock</p>
      <p *ngSwitchDefault>Unknown</p>

    </div>

    <p [ngStyle]="{
      color: getStatusColor(p.status),
      fontWeight: 'bold'
    }">

      <span [ngSwitch]="p.status">

        <span *ngSwitchCase="'available'">✅ In Stock</span>
        <span *ngSwitchCase="'out'">❌ Out Of Stock</span>
        <span *ngSwitchCase="'limited'">⚠️ Limited Stock</span>
        <span *ngSwitchDefault>Unknown</span>

      </span>

    </p>

  </div>
</div>
<!-- //lazy loading i can show what i want and what i want to hide -->
